<!DOCTYPE html>
<html lang="ko">
<head>

    name="viewport"
    content="width=device-width, initial-scale=1.0"

<title>SOOP Effect</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Dongle:wght@300;400;700&family=Gaegu:wght@300;400;700&family=Gamja+Flower&family=Gowun+Dodum&family=Hi+Melody&family=Jua&family=Single+Day&family=Galmuri11&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
:root { --bg: #0f1014; --panel: #191b22; --panel2: #20232c; --line: #343844; --text: #f5f5f7; --muted: #a8abb5; --accent: #8067ff; --accent-hover: #917cff; }
html { min-height: 100%; }
body { margin: 0px; min-height: 100vh; padding: 32px 18px 80px; background: radial-gradient(circle at 50% -10%, rgb(37, 35, 58) 0px, rgb(18, 19, 25) 38%, rgb(12, 13, 17) 100%); color: var(--text); font-family: Arial, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
button, input, textarea { font: inherit; }
button { color: inherit; }
.hidden { display: none !important; }
.app { width: min(1180px, 100%); margin: 0px auto; }
.header { margin-bottom: 26px; }
.header h1 { margin: 0px 0px 10px; font-size: clamp(28px, 4vw, 42px); letter-spacing: -1.5px; }
.header p { margin: 0px; color: var(--muted); line-height: 1.7; }
.panel { margin-bottom: 18px; padding: 24px; background: rgba(25, 27, 34, 0.94); border: 1px solid var(--line); border-radius: 18px; box-shadow: rgba(0, 0, 0, 0.16) 0px 12px 35px; }
.panel h2 { margin: 0px 0px 20px; font-size: 20px; }
.panel h3 { margin: 0px 0px 18px; font-size: 17px; }
.mode-buttons, .ratio-buttons, .photo-tabs { display: flex; flex-wrap: wrap; gap: 10px; }
.mode-button, .ratio-button, .photo-tab, .secondary-button, .primary-button { appearance: none; border: 1px solid rgb(59, 64, 76); border-radius: 11px; padding: 11px 18px; background: rgb(41, 45, 54); cursor: pointer; transition: background 0.18s, border-color 0.18s, transform 0.18s; }
.mode-button:hover, .ratio-button:hover, .photo-tab:hover, .secondary-button:hover { background: rgb(53, 58, 70); }
.mode-button:active, .ratio-button:active, .photo-tab:active, .secondary-button:active, .primary-button:active { transform: scale(0.97); }
.mode-button.active, .ratio-button.active, .photo-tab.active { background: var(--accent); border-color: var(--accent); }
.primary-button { width: 100%; padding: 16px; border-color: var(--accent); background: var(--accent); font-size: 17px; font-weight: 700; }
.primary-button:hover { background: var(--accent-hover); }
.upload-grid { display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 14px; }
.upload-box { display: flex; flex-direction: column; gap: 8px; padding: 18px; border: 1px solid rgb(58, 62, 73); border-radius: 13px; background: rgb(21, 23, 28); }
.upload-box strong { font-size: 16px; }
.upload-box span { color: var(--muted); font-size: 13px; }
.upload-box input[type="file"] { width: 100%; margin-top: 6px; color: rgb(216, 217, 222); }
.single-upload { max-width: 500px; }
.editor-layout { display: grid; grid-template-columns: minmax(0px, 1fr) 280px; gap: 22px; margin-top: 18px; align-items: start; }
.editor-column { min-width: 0px; }
.control-column { padding: 18px; background: rgb(20, 22, 27); border: 1px solid rgb(48, 52, 62); border-radius: 14px; }
.crop-area { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 15px; cursor: grab; user-select: none; touch-action: none; background-color: rgb(17, 19, 24); background-image: linear-gradient(45deg, rgb(27, 30, 36) 25%, transparent 25%), linear-gradient(-45deg, rgb(27, 30, 36) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, rgb(27, 30, 36) 75%), linear-gradient(-45deg, transparent 75%, rgb(27, 30, 36) 75%); background-size: 24px 24px; background-position: 0px 0px, 0px 12px, 12px -12px, -12px 0px; }
.crop-area:active { cursor: grabbing; }
.crop-area img { position: absolute; left: 50%; top: 50%; max-width: none; display: block; pointer-events: none; user-select: none; transform-origin: center center; }
.empty-message { position: absolute; inset: 0px; display: grid; place-items: center; color: rgb(116, 121, 134); font-size: 14px; pointer-events: none; }
.control { display: block; margin-bottom: 20px; }
.control > span { display: block; margin-bottom: 9px; color: rgb(200, 202, 208); font-size: 14px; }
.control input[type="range"] { width: 100%; accent-color: var(--accent); }
.control input[type="text"] { width: 100%; padding: 11px 12px; border: 1px solid rgb(60, 65, 77); border-radius: 9px; outline: none; background: rgb(16, 18, 23); color: white; }
.control input[type="text"]:focus { border-color: var(--accent); }
.switch-line { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; cursor: pointer; }
.switch-line input { width: 17px; height: 17px; accent-color: var(--accent); }
.secondary-button { width: 100%; }
.help { margin: 14px 0px 0px; color: var(--muted); font-size: 13px; line-height: 1.7; }
.effect-grid { display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 14px; }
.effect-card { padding: 18px; background: rgb(20, 22, 27); border: 1px solid rgb(48, 52, 62); border-radius: 14px; }
.preview-holder { width: min(850px, 100%); margin: 0px auto; }
.normal-preview { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 18px; background: rgb(9, 10, 13); cursor: pointer; user-select: none; transform-origin: center center; }
.preview-photo { position: absolute; left: 50%; top: 50%; max-width: none; display: block; opacity: 0; pointer-events: none; user-select: none; transform-origin: center center; transition: opacity 0.42s; }
.preview-photo1 { opacity: 1; }
.normal-preview:hover .preview-photo1 { opacity: 0; }
.normal-preview:hover .preview-photo2 { opacity: 1; }
.normal-preview.clicked .preview-photo1, .normal-preview.clicked .preview-photo2 { opacity: 0; }
.normal-preview.clicked .preview-photo3 { opacity: 1; }
.preview-shine { position: absolute; z-index: 20; top: -70%; left: -80%; width: 30%; height: 240%; opacity: 0; pointer-events: none; transform: rotate(20deg); filter: blur(6px); background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.04) 15%, rgba(255, 255, 255, 0.22) 30%, rgba(255, 255, 255, 0.65) 43%, rgba(255, 255, 255, 0.96) 50%, rgba(226, 190, 255, 0.62) 57%, rgba(255, 255, 255, 0.16) 70%, transparent 100%); }
@keyframes shineMove { 
  0% { left: -80%; opacity: 0; }
  10% { opacity: 1; }
  75% { opacity: 0.9; }
  100% { left: 140%; opacity: 0; }
}
@keyframes previewBoing { 
  0% { transform: scale(1); }
  18% { transform: scaleX(
                calc(1 - .04 * var(--boing))
            )
            scaleY(
                calc(1 - .09 * var(--boing))
            ); }
  40% { transform: scaleX(
                calc(1 + .035 * var(--boing))
            )
            scaleY(
                calc(1 + .07 * var(--boing))
            ); }
  60% { transform: scaleX(
                calc(1 - .015 * var(--boing))
            )
            scaleY(
                calc(1 - .03 * var(--boing))
            ); }
  78% { transform: scaleX(
                calc(1 + .01 * var(--boing))
            )
            scaleY(
                calc(1 + .025 * var(--boing))
            ); }
  100% { transform: scale(1); }
}
.preview-hearts { position: absolute; z-index: 60; inset: 0px; overflow: hidden; pointer-events: none; }
.heart { position: absolute; left: 50%; top: 50%; font-family: Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-weight: bold; line-height: 1; pointer-events: none; user-select: none; will-change: transform, opacity; animation: heartPop
        var(--heart-duration)
        cubic-bezier(.17,.67,.28,1)
        forwards; }
@keyframes heartPop { 
  0% { opacity: 0; transform: translate(-50%, -50%) translate(0px, 0px) scale(0.25) rotate(0deg); }
  12% { opacity: 1; }
  30% { transform: translate(-50%, -50%)
            translate(
                calc(var(--heart-x) * .45),
                calc(var(--heart-y) * .35)
            )
            scale(1.25)
            rotate(
                calc(var(--heart-r) * .4)
            ); }
  70% { opacity: 0.9; }
  100% { opacity: 0; transform: translate(-50%, -50%)
            translate(
                var(--heart-x),
                var(--heart-y)
            )
            scale(.75)
            rotate(
                var(--heart-r)
            ); }
}
.polaroid-preview { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 18px; background: rgb(5, 5, 5); user-select: none; }
.polaroid-background { position: absolute; left: 50%; top: 50%; max-width: none; display: block; pointer-events: none; transform-origin: center center; filter: blur(18px) brightness(0.68) saturate(0.75); }
.camera-overlay { position: absolute; inset: 0px; z-index: 4; pointer-events: none; background: radial-gradient(circle, transparent 35%, rgba(0, 0, 0, 0.15) 70%, rgba(0, 0, 0, 0.45) 100%); }
.camera-ui { position: absolute; inset: 0px; z-index: 10; pointer-events: none; }
.camera-corner { position: absolute; width: clamp(25px, 4vw, 52px); height: clamp(25px, 4vw, 52px); opacity: 0.9; filter: drop-shadow(rgba(0, 0, 0, 0.35) 0px 1px 3px); }
.camera-corner.tl { top: 3.5%; left: 3.5%; border-top: 3px solid white; border-left: 3px solid white; }
.camera-corner.tr { top: 3.5%; right: 3.5%; border-top: 3px solid white; border-right: 3px solid white; }
.camera-corner.bl { bottom: 3.5%; left: 3.5%; border-bottom: 3px solid white; border-left: 3px solid white; }
.camera-corner.br { right: 3.5%; bottom: 3.5%; border-right: 3px solid white; border-bottom: 3px solid white; }
.rec-ui { position: absolute; top: 5%; left: 5%; display: flex; align-items: center; gap: 8px; color: white; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 2px; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 5px; }
.rec-ui span { width: 11px; height: 11px; border-radius: 50%; background: rgb(255, 54, 85); box-shadow: rgba(255, 54, 85, 0.8) 0px 0px 12px; animation: 1s ease 0s infinite normal none running recBlink; }
@keyframes recBlink { 
  50% { opacity: 0.25; }
}
.camera-info { position: absolute; top: 5%; right: 5%; color: rgba(255, 255, 255, 0.95); font-family: Arial, sans-serif; font-weight: 600; letter-spacing: 1px; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 5px; }
.focus-box { position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; transform: translate(-50%, -50%); opacity: 0.65; background: linear-gradient(white, white) left top / 22px 2px no-repeat, linear-gradient(white, white) left top / 2px 22px no-repeat, linear-gradient(white, white) right top / 22px 2px no-repeat, linear-gradient(white, white) right top / 2px 22px no-repeat, linear-gradient(white, white) left bottom / 22px 2px no-repeat, linear-gradient(white, white) left bottom / 2px 22px no-repeat, linear-gradient(white, white) right bottom / 22px 2px no-repeat, linear-gradient(white, white) right bottom / 2px 22px no-repeat; }
.camera-flash { position: absolute; z-index: 40; inset: 0px; background: white; opacity: 0; pointer-events: none; }
.polaroid-card { position: absolute; z-index: 30; left: 50%; top: 50%; width: 55%; padding: 14px 14px 58px; background: rgb(248, 246, 239); box-shadow: rgba(0, 0, 0, 0.55) 0px 28px 70px; opacity: 0; transform: translate(-50%, -50%) rotate(-2deg); transform-origin: center center; }
.polaroid-image-window { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: rgb(221, 221, 221); }
.polaroid-image-window img { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; object-fit: cover; transform: translate(-50%, -50%); transform-origin: center center; user-select: none; pointer-events: none; }
.polaroid-caption { position: absolute; left: 10px; right: 10px; bottom: 18px; overflow: hidden; text-align: center; color: rgb(51, 51, 51); white-space: nowrap; text-overflow: ellipsis; font-family: "Malgun Gothic", sans-serif; font-size: 18px; letter-spacing: 1px; }
.polaroid-preview.playing .polaroid-background { animation: 1.7s cubic-bezier(0.2, 0.75, 0.25, 1) 0s 1 normal forwards running polaroidFocus; }
@keyframes polaroidFocus { 
  0% { filter: blur(20px) brightness(0.6) saturate(0.65); transform: translate(-50%, -50%) scale(1.1); }
  55% { filter: blur(8px) brightness(0.72) saturate(0.82); }
  100% { filter: blur(1px) brightness(0.82) saturate(0.92); transform: translate(-50%, -50%) scale(1.03); }
}
.polaroid-preview.playing .focus-box { animation: 1.6s ease-out 0s 1 normal forwards running focusBoxMove; }
@keyframes focusBoxMove { 
  0% { transform: translate(-50%, -50%) scale(1.35); opacity: 0.25; }
  65% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.85; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0.65; }
}
.polaroid-preview.playing .camera-flash { animation: 0.42s ease-out 1.65s 1 normal forwards running cameraFlash; }
@keyframes cameraFlash { 
  0% { opacity: 0; }
  18% { opacity: 0.95; }
  38% { opacity: 0.25; }
  100% { opacity: 0; }
}
.polaroid-preview.playing .polaroid-card { animation: 1.05s cubic-bezier(0.22, 0.85, 0.28, 1) 1.78s 1 normal forwards running polaroidPop; }
@keyframes polaroidPop { 
  0% { opacity: 0; transform: translate(-50%, -34%)
            rotate(calc(var(--final-rotation, -2deg) - 5deg))
            scale(.72); }
  28% { opacity: 1; transform: translate(-50%, -52.2%)
            rotate(calc(var(--final-rotation, -2deg) + 1.8deg))
            scale(1.035); }
  48% { transform: translate(-50%, -49.1%)
            rotate(calc(var(--final-rotation, -2deg) - .9deg))
            scale(.988); }
  66% { transform: translate(-50%, -50.35%)
            rotate(calc(var(--final-rotation, -2deg) + .38deg))
            scale(1.006); }
  82% { transform: translate(-50%, -49.9%)
            rotate(calc(var(--final-rotation, -2deg) - .12deg))
            scale(.998); }
  100% { opacity: 1; transform: translate(-50%, -50%)
            rotate(var(--final-rotation, -2deg))
            scale(1); }
}
.replay-button { width: auto; display: block; margin: 18px auto 0px; }
.export-panel { margin-top: 28px; }
.export-result { margin-top: 20px; padding: 18px; background: rgb(18, 20, 25); border: 1px solid rgb(48, 52, 62); border-radius: 13px; }
.export-result h3 { margin-top: 0px; }
#iframeCode { width: 100%; min-height: 150px; margin: 4px 0px 12px; padding: 12px; resize: vertical; border: 1px solid rgb(60, 65, 77); border-radius: 10px; outline: none; background: rgb(9, 10, 13); color: rgb(223, 225, 230); line-height: 1.6; }
@media (max-width: 850px) {
  body { padding: 18px 10px 60px; }
  .panel { padding: 18px; }
  .upload-grid, .effect-grid, .editor-layout { grid-template-columns: 1fr; }
  .control-column { padding: 15px; }
}
@media (max-width: 520px) {
  .mode-buttons, .ratio-buttons, .photo-tabs { display: grid; grid-template-columns: 1fr; }
  .mode-button, .ratio-button, .photo-tab { width: 100%; }
  .panel { border-radius: 14px; }
}
.login-gate { position: fixed; inset: 0px; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgb(11, 13, 18); }
.login-box { width: 100%; max-width: 420px; padding: 40px 32px; border: 1px solid rgb(48, 53, 67); border-radius: 20px; background: rgb(23, 26, 33); text-align: center; }
.login-box h1 { margin: 0px 0px 12px; font-size: 26px; }
.login-box p { margin: 0px 0px 24px; color: rgb(174, 181, 197); }
#loginPassword { box-sizing: border-box; width: 100%; height: 52px; padding: 0px 16px; border: 1px solid rgb(59, 65, 80); border-radius: 10px; background: rgb(15, 17, 23); color: rgb(255, 255, 255); font-size: 16px; outline: none; }
#loginPassword:focus { border-color: rgb(124, 99, 255); }
#loginButton { width: 100%; height: 52px; margin-top: 14px; border: 0px; border-radius: 10px; background: rgb(124, 99, 255); color: rgb(255, 255, 255); font-size: 16px; font-weight: 700; cursor: pointer; }
#loginButton:hover { filter: brightness(1.08); }
#loginButton:disabled { opacity: 0.6; cursor: wait; }
#loginError { min-height: 20px; margin: 14px 0px 0px; color: rgb(255, 107, 107); font-size: 14px; }
body:not(.authenticated) .app { display: none; }
body.authenticated .login-gate { display: none; }
.control select, .control input[type="number"] { width: 100%; padding: 11px 12px; border: 1px solid rgb(60, 65, 77); border-radius: 9px; outline: none; background: rgb(16, 18, 23); color: white; }
.control select:focus, .control input[type="number"]:focus { border-color: var(--accent); }
.preview-touches { position: absolute; z-index: 65; inset: 0px; overflow: hidden; pointer-events: none; }
.touch-particle { position: absolute; left: 50%; top: 50%; line-height: 1; pointer-events: none; user-select: none; will-change: transform, opacity; animation: touchParticlePop var(--touch-duration) cubic-bezier(.16,.8,.25,1) forwards; }
.touch-particle.touch-star { color: rgba(255, 255, 255, 0.98); text-shadow: rgba(255, 255, 255, 0.95) 0px 0px 8px, rgba(220, 205, 255, 0.7) 0px 0px 18px; }
.touch-particle.touch-light { border-radius: 50%; background: rgba(255, 255, 255, 0.95); box-shadow: rgba(255, 255, 255, 0.95) 0px 0px 8px, rgba(225, 210, 255, 0.8) 0px 0px 22px; }
.touch-particle.touch-dust { border-radius: 50%; background: rgba(255, 255, 255, 0.9); box-shadow: rgba(255, 255, 255, 0.9) 0px 0px 6px; }
@keyframes touchParticlePop { 
  0% { opacity: 0; transform: translate(-50%, -50%) translate(0px, 0px) scale(0.2) rotate(0deg); }
  18% { opacity: 1; }
  55% { opacity: 0.95; transform: translate(-50%, -50%)
            translate(calc(var(--touch-x) * .65), calc(var(--touch-y) * .65))
            scale(1.15)
            rotate(calc(var(--touch-r) * .65)); }
  100% { opacity: 0; transform: translate(-50%, -50%)
            translate(var(--touch-x), var(--touch-y))
            scale(.45)
            rotate(var(--touch-r)); }
}
.resolution-controls { display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 14px; max-width: 620px; }
@media (max-width: 650px) {
  .resolution-controls { grid-template-columns: 1fr; }
}
.story-photo-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.story-photo-chip { padding: 8px 11px; border: 1px solid rgb(52, 56, 68); border-radius: 9px; background: rgb(20, 22, 27); color: rgb(207, 210, 218); font-size: 13px; cursor: pointer; }
.story-photo-chip.active { border-color: var(--accent); background: rgba(128, 103, 255, 0.16); color: rgb(255, 255, 255); }
.story-preview-holder { width: min(430px, 100%); margin: 0px auto; }
.story-preview { position: relative; width: 100%; aspect-ratio: 9 / 16; overflow: hidden; border-radius: 20px; background: rgb(9, 10, 13); user-select: none; touch-action: pan-y; outline: none; }
.story-preview-image { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; object-fit: cover; transform-origin: center center; pointer-events: none; will-change: transform, opacity; }
.story-empty { position: absolute; inset: 0px; display: grid; place-items: center; padding: 30px; color: rgb(125, 130, 144); text-align: center; pointer-events: none; }
.story-progress { position: absolute; z-index: 30; top: 12px; left: 12px; right: 12px; display: flex; gap: 5px; pointer-events: none; }
.story-progress-item { position: relative; height: 3px; flex: 1 1 0%; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, 0.34); }
.story-progress-fill { position: absolute; inset: 0px; transform: scaleX(0); transform-origin: left center; background: rgb(255, 255, 255); }
.story-progress-item.done .story-progress-fill { transform: scaleX(1); }
.story-progress-item.current .story-progress-fill.playing { animation: storyProgress var(--story-duration) linear forwards; }
@keyframes storyProgress { 
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}
.story-nav { position: absolute; z-index: 20; top: 0px; bottom: 0px; width: 50%; border: 0px; padding: 0px; background: transparent; color: rgb(255, 255, 255); cursor: pointer; }
.story-nav-prev { left: 0px; }
.story-nav-next { right: 0px; }
.story-nav span { position: absolute; top: 50%; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: rgba(0, 0, 0, 0.28); opacity: 0; font-size: 30px; transform: translateY(-50%); transition: opacity 0.18s; }
.story-nav-prev span { left: 12px; }
.story-nav-next span { right: 12px; }
@media (hover: hover) and (pointer: fine) {
  .story-preview:hover .story-nav span { opacity: 0.8; }
}
.story-counter { position: absolute; z-index: 31; right: 12px; bottom: 12px; padding: 5px 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.4); color: rgb(255, 255, 255); font-size: 12px; pointer-events: none; }
.story-preview-image.story-fade { animation: 0.32s ease-out 0s 1 normal none running storyFade; }
.story-preview-image.story-slide-next { animation: 0.34s cubic-bezier(0.22, 0.8, 0.28, 1) 0s 1 normal none running storySlideNext; }
.story-preview-image.story-slide-prev { animation: 0.34s cubic-bezier(0.22, 0.8, 0.28, 1) 0s 1 normal none running storySlidePrev; }
.story-preview-image.story-zoom { animation: 0.38s ease-out 0s 1 normal none running storyZoom; }
@keyframes storyFade { 
  0% { opacity: 0.15; }
  100% { opacity: 1; }
}
@keyframes storySlideNext { 
  0% { opacity: 0.45; transform: translate(-38%,-50%) scale(var(--story-zoom,1)); }
  100% { opacity: 1; transform: translate(-50%,-50%) scale(var(--story-zoom,1)); }
}
@keyframes storySlidePrev { 
  0% { opacity: 0.45; transform: translate(-62%,-50%) scale(var(--story-zoom,1)); }
  100% { opacity: 1; transform: translate(-50%,-50%) scale(var(--story-zoom,1)); }
}
@keyframes storyZoom { 
  0% { opacity: 0.45; transform: translate(-50%,-50%) scale(calc(var(--story-zoom,1)*.94)); }
  100% { opacity: 1; transform: translate(-50%,-50%) scale(var(--story-zoom,1)); }
}
.story-upload-slots { display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 14px; margin-top: 14px; }
.story-upload-slot { position: relative; min-width: 0px; }
.story-upload-label { display: flex; min-height: 132px; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 14px; border: 1px dashed rgb(69, 75, 89); border-radius: 12px; background: rgb(18, 20, 25); cursor: pointer; text-align: center; overflow: hidden; }
.story-upload-label:hover { border-color: var(--accent); }
.story-upload-label input { display: none; }
.story-upload-title { font-weight: 700; color: rgb(255, 255, 255); }
.story-upload-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgb(156, 162, 177); font-size: 12px; }
.story-upload-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 9px; display: none; }
.story-upload-slot.has-photo .story-upload-thumb { display: block; }
.story-upload-slot.has-photo .story-upload-icon { display: none; }
.story-remove-photo { width: 100%; margin-top: 7px; padding: 8px 10px; border: 1px solid rgb(60, 65, 77); border-radius: 8px; background: rgb(26, 29, 36); color: rgb(221, 221, 221); cursor: pointer; }
.story-add-photo { margin-top: 14px; }
@media (max-width: 760px) {
  .story-upload-slots { grid-template-columns: 1fr; }
}
.story-preview-image.story-fade, .story-preview-image.story-slide-next, .story-preview-image.story-slide-prev, .story-preview-image.story-zoom { animation: 0.28s ease-out 0s 1 normal none running storyStorySafeFade; }
@keyframes storyStorySafeFade { 
  0% { opacity: 0.15; }
  100% { opacity: 1; }
}
.story-profile-settings { display: grid; grid-template-columns: minmax(220px, 0.8fr) minmax(220px, 1.2fr); gap: 14px; margin-bottom: 14px; }
.story-profile-settings .control input[type="text"] { width: 100%; padding: 11px 12px; border: 1px solid rgb(60, 65, 77); border-radius: 9px; background: rgb(16, 18, 23); color: rgb(255, 255, 255); outline: none; }
.story-profile-settings .control input[type="text"]:focus { border-color: var(--accent); }
.story-profile-upload { min-height: 92px; }
.story-top-ui { position: absolute; z-index: 40; left: 14px; right: 12px; top: 28px; display: flex; align-items: center; gap: 9px; color: rgb(255, 255, 255); text-shadow: rgba(0, 0, 0, 0.55) 0px 1px 3px; pointer-events: none; }
.story-profile-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: rgba(255, 255, 255, 0.14); border: 1.5px solid rgba(255, 255, 255, 0.9); }
.story-profile-meta { display: flex; align-items: center; gap: 7px; min-width: 0px; font-size: 13px; }
.story-profile-meta strong { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.story-profile-meta span { font-size: 12px; color: rgba(255, 255, 255, 0.76); }
.story-more { margin-left: auto; border: 0px; background: transparent; color: rgb(255, 255, 255); font-size: 19px; letter-spacing: 1px; padding: 4px; pointer-events: none; }
.story-bottom-ui { position: absolute; z-index: 40; left: 14px; right: 14px; bottom: 16px; display: flex; align-items: center; gap: 10px; color: rgb(255, 255, 255); pointer-events: none; }
.story-reply-box { flex: 1 1 0%; min-width: 0px; height: 38px; display: flex; align-items: center; padding: 0px 15px; border: 1px solid rgba(255, 255, 255, 0.86); border-radius: 999px; color: rgba(255, 255, 255, 0.88); font-size: 13px; background: rgba(0, 0, 0, 0.08); text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 2px; }
.story-bottom-icon { width: 34px; height: 34px; display: grid; place-items: center; padding: 0px; border: 0px; background: transparent; color: rgb(255, 255, 255); font-size: 29px; line-height: 1; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.55) 0px 1px 3px; }
.story-send-icon { font-size: 27px; transform: rotate(-25deg); }
.story-counter { bottom: 62px; }
@media (max-width: 650px) {
  .story-profile-settings { grid-template-columns: 1fr; }
}
.story-ratio-choice { margin-bottom: 14px; }
.story-ratio-choice > span { display: block; margin-bottom: 8px; color: rgb(207, 210, 218); font-size: 13px; }
.story-ratio-buttons { display: flex; gap: 8px; }
.story-ratio-button { padding: 9px 14px; border: 1px solid rgb(60, 65, 77); border-radius: 9px; background: rgb(21, 23, 29); color: rgb(221, 221, 221); cursor: pointer; }
.story-ratio-button.active { border-color: var(--accent); background: rgba(128, 103, 255, 0.18); color: rgb(255, 255, 255); }
.story-preview[data-story-ratio="16:9"] { aspect-ratio: 16 / 9; }
.story-preview[data-story-ratio="9:16"] { aspect-ratio: 9 / 16; }
.story-upload-label.drag-over, .story-profile-upload.drag-over { border-color: var(--accent) !important; background: rgba(128, 103, 255, 0.12) !important; }
.story-preview[data-story-ratio="9:16"] { width: min(430px, 100%); height: auto !important; aspect-ratio: 9 / 16 !important; }
.story-preview[data-story-ratio="16:9"] { width: 100%; max-width: 760px; height: auto !important; aspect-ratio: 16 / 9 !important; }
.story-preview-holder:has(.story-preview[data-story-ratio="16:9"]) { width: min(760px, 100%); }
.story-preview-holder:has(.story-preview[data-story-ratio="9:16"]) { width: min(430px, 100%); }
.fisheye-preview { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 18px; background: rgb(9, 10, 13); touch-action: none; user-select: none; }
.fisheye-preview canvas { display: block; width: 100%; height: 100%; }
.fisheye-behavior-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
.fisheye-behavior.active { outline: 2px solid var(--accent); outline-offset: 1px; }
.fisheye-upload { max-width: 520px; }
.fisheye-preview { max-width: 680px; margin-left: auto; margin-right: auto; border: 3px solid rgba(255, 255, 255, 0.88); box-shadow: rgba(0, 0, 0, 0.45) 0px 0px 0px 1px, rgba(0, 0, 0, 0.25) 0px 12px 34px; cursor: grab; border-radius: 50% !important; aspect-ratio: 1 / 1 !important; }
.fisheye-preview:active { cursor: grabbing; }
.fisheye-preview canvas { border-radius: 50%; }
.story-preview { touch-action: none !important; cursor: grab; }
.story-preview:active { cursor: grabbing; }



/* =====================================================
   배포 페이지 전용
===================================================== */

html,
body {
    margin: 0 !important;
    padding: 0 !important;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent !important;
}


body {
    position: relative;
}


#soop-effect-root {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

    user-select: none;
    -webkit-user-select: none;
}


/* =====================================================
   미리보기 전체를 iframe 크기에 맞춤
===================================================== */

#soop-effect-root > .normal-preview,
#soop-effect-root > .polaroid-preview {

    position: absolute !important;

    inset: 0 !important;

    width: 100% !important;
    height: 100% !important;

    max-width: none !important;
    max-height: none !important;

    margin: 0 !important;
    padding: 0 !important;

    border-radius: 18px !important;

    aspect-ratio:
        9 / 16 !important;

    overflow: hidden !important;
}



/* =====================================================
   스토리 배포 전용
   PC에서는 인스타 스토리처럼 가운데 적당한 크기로 표시
===================================================== */
#soop-effect-root > .story-preview {
    position: absolute !important;
    left: 50% !important;
    top: 50% !important;
    inset: auto !important;
    transform: translate(-50%, -50%) !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    border-radius: 18px !important;
}
#soop-effect-root > .story-preview[data-story-ratio="9:16"] {
    width: min(430px, 100vw) !important;
    height: min(764px, 100vh) !important;
    max-width: 100vw !important;
    max-height: 100vh !important;
    aspect-ratio: 9 / 16 !important;
}
#soop-effect-root > .story-preview[data-story-ratio="16:9"] {
    width: min(960px, 100vw) !important;
    height: auto !important;
    max-height: 100vh !important;
    aspect-ratio: 16 / 9 !important;
}

/* =====================================================
   일반 사진
===================================================== */

#soop-effect-root .preview-photo {

    position: absolute !important;

    left: 50% !important;
    top: 50% !important;

    max-width: none !important;
    max-height: none !important;

    transform-origin:
        center center !important;

    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
}


/* =====================================================
   폴라로이드 배포 전용

   기존 편집기 크기에 묶이지 않고
   iframe 전체를 기준으로 다시 계산합니다.
===================================================== */

#soop-effect-root > .polaroid-preview {

    background: transparent !important;
}


#soop-effect-root .polaroid-preview-background,
#soop-effect-root #polaroidPreviewBackground {

    position: absolute !important;

    max-width: none !important;
    max-height: none !important;

    transform: translate(-50%, -50%) !important;

    transform-origin: center center !important;

    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
}


#soop-effect-root .polaroid-card,
#soop-effect-root #polaroidCard {

    transform-origin: center center;
}


#soop-effect-root .polaroid-inner-image,
#soop-effect-root #polaroidInnerImage {

    max-width: none !important;
    max-height: none !important;

    image-rendering: auto;

    -webkit-user-drag: none;
    user-select: none;
}

</style>

                    if (

                        !img.src
                    ) {
                        return;
                    }


                    const update = () => {

                        if (
                            !img.naturalWidth ||
                            !img.naturalHeight
                        ) {
                            return;
                        }


                        const photo =
                            photos[index];


                        const scale =
                            Math.max(
                                cw /
                                    img.naturalWidth,

                                ch /
                                    img.naturalHeight
                            ) *
                            photo.zoom;


                        const width =
                            img.naturalWidth *
                            scale;


                        const height =
                            img.naturalHeight *
                            scale;


                        img.style.width =
                            width + "px";


                        img.style.height =
                            height + "px";


                        img.style.left =
                            "50%";


                        img.style.top =
                            "50%";


                        img.style.transform =
                            "translate(-50%, -50%) " +
                            "translate(" +
                            (
                                photo.x *
                                scaleX
                            ) +
                            "px, " +
                            (
                                photo.y *
                                scaleY
                            ) +
                            "px)";
                    };


                    if (
                        img.complete &&
                        img.naturalWidth
                    ) {

                        update();

                    } else {

                        img.addEventListener(
                            "load",
                            update,
                            {
                                once: true
                            }
                        );
                    }
                }
            );
        }


        /* =============================================
           광택 - 일반 모드 전용
        ============================================= */

        const shineOn =
            true;

        const shinePowerValue =
            0.8;

        const shineSpeedValue =
            0.7;


        function playShine() {

            if (
                !shineOn ||
                !shine
            ) {
                return;
            }


            shine.style.animation =
                "none";


            shine.style.opacity =
                String(
                    shinePowerValue
                );


            void shine.offsetWidth;


            shine.style.animation =
                "shineMove " +
                shineSpeedValue +
                "s ease-out";
        }


        /* =============================================
           보잉 - 일반 모드 전용
        ============================================= */

        const boingOn =
            true;

        const boingPowerValue =
            1;


        function playBoing() {

            if (!boingOn) {
                return;
            }


            preview.style.setProperty(
                "--boing",
                String(
                    boingPowerValue
                )
            );


            preview.style.animation =
                "none";


            void preview.offsetWidth;


            preview.style.animation =
                "previewBoing .58s ease-out";
        }


        /* =============================================
           하트 - 일반 모드 전용
        ============================================= */

        const heartsOn =
            true;

        const heartCountValue =
            14;

        const heartSizeValue =
            32;

        const heartSpreadValue =
            200;


        function createHearts() {

            if (
                !heartsOn ||
                !hearts
            ) {
                return;
            }


            const symbols = [
                "♥",
                "♡",
                "💗",
                "💕"
            ];


            for (
                let i = 0;
                i < heartCountValue;
                i++
            ) {

                const heart =
                    document.createElement(
                        "span"
                    );


                heart.className =
                    "heart";


                heart.textContent =
                    symbols[
                        Math.floor(
                            Math.random() *
                            symbols.length
                        )
                    ];


                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    heartSpreadValue *
                    (
                        0.35 +
                        Math.random() *
                        0.65
                    );


                const x =
                    Math.cos(angle) *
                    distance;


                const y =
                    Math.sin(angle) *
                    distance;


                const rotation =
                    -90 +
                    Math.random() *
                    180;


                const actualSize =
                    heartSizeValue *
                    (
                        0.65 +
                        Math.random() *
                        0.75
                    );


                heart.style.fontSize =
                    actualSize +
                    "px";


                heart.style.color =
                    Math.random() > 0.5
                        ? "#ff6fae"
                        : "#ff9ac5";


                heart.style.setProperty(
                    "--heart-x",
                    x + "px"
                );


                heart.style.setProperty(
                    "--heart-y",
                    y + "px"
                );


                heart.style.setProperty(
                    "--heart-r",
                    rotation + "deg"
                );


                heart.style.setProperty(
                    "--heart-duration",
                    (
                        0.65 +
                        Math.random() *
                        0.55
                    ) +
                    "s"
                );


                hearts.appendChild(
                    heart
                );


                heart.addEventListener(
                    "animationend",
                    () => {
                        heart.remove();
                    }
                );
            }
        }


        /* =============================================
           마우스 오버 터치 효과
        ============================================= */

        const touchOn =
            true;

        const touchTypeValue =
            "star";

        const touchCountValue =
            12;

        const touchSizeValue =
            24;

        const touchSpreadValue =
            180;


        function createTouchParticles() {

            if (
                !touchOn ||
                !touches
            ) {
                return;
            }

            for (
                let i = 0;
                i < touchCountValue;
                i++
            ) {

                const particle =
                    document.createElement(
                        "span"
                    );

                particle.className =
                    "touch-particle touch-" +
                    touchTypeValue;

                if (
                    touchTypeValue === "star"
                ) {
                    particle.textContent =
                        Math.random() > .45
                            ? "✦"
                            : "✧";
                }

                const angle =
                    Math.random() *
                    Math.PI *
                    2;

                const distance =
                    touchSpreadValue *
                    (
                        .2 +
                        Math.random() * .8
                    );

                const x =
                    Math.cos(angle) *
                    distance;

                const y =
                    Math.sin(angle) *
                    distance;

                const actualSize =
                    touchSizeValue *
                    (
                        .55 +
                        Math.random() * .8
                    );

                const rotation =
                    -90 +
                    Math.random() * 180;

                particle.style.fontSize =
                    actualSize + "px";

                if (
                    touchTypeValue !== "star"
                ) {
                    const dotSize =
                        Math.max(
                            3,
                            actualSize *
                            (
                                touchTypeValue === "light"
                                    ? .34
                                    : .18
                            )
                        );

                    particle.style.width =
                        dotSize + "px";

                    particle.style.height =
                        dotSize + "px";
                }

                particle.style.setProperty(
                    "--touch-x",
                    x + "px"
                );

                particle.style.setProperty(
                    "--touch-y",
                    y + "px"
                );

                particle.style.setProperty(
                    "--touch-r",
                    rotation + "deg"
                );

                particle.style.setProperty(
                    "--touch-duration",
                    (
                        .55 +
                        Math.random() * .55
                    ) +
                    "s"
                );

                touches.appendChild(
                    particle
                );

                particle.addEventListener(
                    "animationend",
                    () => particle.remove()
                );
            }
        }


        /* =============================================
           ① → ② + 광택
        ============================================= */

        preview.addEventListener(
            "mouseenter",
            () => {

                preview.classList.remove(
                    "clicked"
                );

                playShine();

                createTouchParticles();
            }
        );


        /* =============================================
           클릭 → ③ + 보잉 + 하트
        ============================================= */

        preview.addEventListener(
            "click",
            () => {

                const photo2 =
                    previewPhotos[1];


                const photo3 =
                    previewPhotos[2];


                if (
                    !photo2 ||
                    !photo3 ||
                    !photo2.getAttribute(
                        "src"
                    ) ||
                    !photo3.getAttribute(
                        "src"
                    )
                ) {
                    return;
                }


                preview.classList.add(
                    "clicked"
                );


                playBoing();

                createHearts();
            }
        );


        /* =============================================
           마우스를 떼면 ①
        ============================================= */

        preview.addEventListener(
            "mouseleave",
            () => {

                preview.classList.remove(
                    "clicked"
                );

                playShine();
            }
        );


        updatePhotos();


        window.addEventListener(
            "resize",
            updatePhotos
        );
    }


    /* =================================================
       폴라로이드 모드

       중요:
       이 블록에는 광택 / 보잉 / 하트 코드가 없습니다.
    ================================================= */

    if (polaroidPreview) {

        const preview =
            polaroidPreview;


        const background =
            preview.querySelector(
                "#polaroidPreviewBackground"
            ) ||
            preview.querySelector(
                ".polaroid-preview-background"
            );


        const card =
            preview.querySelector(
                "#polaroidCard"
            ) ||
            preview.querySelector(
                ".polaroid-card"
            );


        const innerImage =
            preview.querySelector(
                "#polaroidInnerImage"
            ) ||
            preview.querySelector(
                ".polaroid-inner-image"
            );


        /*
         * 생성기에서 폴라로이드 미리보기의
         * 실제 기준 크기
         */

        const editorWidth =
            1;

        const editorHeight =
            1;


        /*
         * 현재 폴라로이드 설정을
         * 배포 페이지 안에 저장
         */

        const settings = {"x":0,"y":0,"zoom":1,"cardX":0,"cardY":0,"innerX":0,"innerY":0,"innerZoom":1};


        /* =============================================
           폴라로이드 크기/위치 다시 계산
        ============================================= */

        function updatePolaroidLayout() {

            const cw =
                preview.clientWidth;


            const ch =
                preview.clientHeight;


            if (
                !cw ||
                !ch
            ) {
                return;
            }


            const scaleX =
                cw / editorWidth;


            const scaleY =
                ch / editorHeight;


            const uniformScale =
                Math.min(
                    scaleX,
                    scaleY
                );


            /* =========================================
               배경 사진

               iframe 전체를 cover 방식으로 채웁니다.
               검은 여백 방지.
            ========================================= */

            if (background) {

                const updateBackground =
                    () => {

                        if (
                            !background.naturalWidth ||
                            !background.naturalHeight
                        ) {
                            return;
                        }


                        const coverScale =
                            Math.max(
                                cw /
                                    background.naturalWidth,

                                ch /
                                    background.naturalHeight
                            ) *
                            settings.zoom;


                        const width =
                            background.naturalWidth *
                            coverScale;


                        const height =
                            background.naturalHeight *
                            coverScale;


                        background.style.width =
                            width + "px";


                        background.style.height =
                            height + "px";


                        background.style.left =
                            "calc(50% + " +
                            (
                                settings.x *
                                scaleX
                            ) +
                            "px)";


                        background.style.top =
                            "calc(50% + " +
                            (
                                settings.y *
                                scaleY
                            ) +
                            "px)";


                        background.style.transform =
                            "translate(-50%, -50%)";
                    };


                if (
                    background.complete &&
                    background.naturalWidth
                ) {

                    updateBackground();

                } else {

                    background.addEventListener(
                        "load",
                        updateBackground,
                        {
                            once: true
                        }
                    );
                }
            }


            /* =========================================
               폴라로이드 카드 위치

               생성기에서 정한 위치를
               iframe 크기에 맞게 비례 조정합니다.
            ========================================= */

            if (card) {

                card.style.left =
                    "calc(50% + " +
                    (
                        settings.cardX *
                        scaleX
                    ) +
                    "px)";


                card.style.top =
                    "calc(50% + " +
                    (
                        settings.cardY *
                        scaleY
                    ) +
                    "px)";
            }


            /* =========================================
               카드 안쪽 사진

               기존 편집 위치와 확대값은 유지하면서
               SOOP 크기에 맞춰 이동값만 보정합니다.

               이미지 자체는 최적화된 고해상도 원본을
               그대로 사용합니다.
            ========================================= */

            if (innerImage) {

                innerImage.style.transform =
                    "translate(-50%, -50%) " +
                    "translate(" +
                    (
                        settings.innerX *
                        uniformScale
                    ) +
                    "px, " +
                    (
                        settings.innerY *
                        uniformScale
                    ) +
                    "px) " +
                    "scale(" +
                    settings.innerZoom +
                    ")";
            }
        }


        /* =============================================
           클릭할 때마다 폴라로이드 재생

           일반 모드 효과는 실행하지 않습니다.
        ============================================= */

        function replayPolaroid() {

            preview.classList.remove(
                "playing"
            );


            void preview.offsetWidth;


            preview.classList.add(
                "playing"
            );
        }


        preview.addEventListener(
            "click",
            replayPolaroid
        );


        /* =============================================
           최초 배치
        ============================================= */

        updatePolaroidLayout();


        /*
         * 이미지가 조금 늦게 로드되는 경우를 위해
         * 한 번 더 계산합니다.
         */

        requestAnimationFrame(
            updatePolaroidLayout
        );


        window.addEventListener(
            "load",
            updatePolaroidLayout
        );


        window.addEventListener(
            "resize",
            updatePolaroidLayout
        );
    }

})();

        /* 어안렌즈 배포 동작 */
        const fisheyeRoot=document.querySelector("#soop-effect-root > .fisheye-preview");
        if(fisheyeRoot){
            const c=fisheyeRoot.querySelector("#fisheyeDeployCanvas");
            const img=fisheyeRoot.querySelector("#fisheyeDeploySource");
            const ctx=c.getContext("2d",{willReadFrequently:true});
            let cx=Number(fisheyeRoot.dataset.fisheyeCx||.5),cy=Number(fisheyeRoot.dataset.fisheyeCy||.5);
            const strength=Number(fisheyeRoot.dataset.fisheyeStrength||60);
            const radius=Number(fisheyeRoot.dataset.fisheyeRadius||75);
            const photoZoom=Number(fisheyeRoot.dataset.fisheyeZoom||1);
            const photoX=Number(fisheyeRoot.dataset.fisheyePhotoX||0);
            const photoY=Number(fisheyeRoot.dataset.fisheyePhotoY||0);
            const behavior=fisheyeRoot.dataset.fisheyeBehavior||"follow";
            function drawFish(){
                if(!img.naturalWidth||!fisheyeRoot.clientWidth||!fisheyeRoot.clientHeight)return;
                const W=Math.max(1,Math.round(fisheyeRoot.clientWidth));
                const H=Math.max(1,Math.round(fisheyeRoot.clientHeight));
                c.width=W;c.height=H;c.style.width="100%";c.style.height="100%";
                const scale=Math.max(W/img.naturalWidth,H/img.naturalHeight)*photoZoom;
                const dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;
                const dx=(W-dw)/2+photoX*W,dy=(H-dh)/2+photoY*H;
                ctx.clearRect(0,0,W,H);ctx.drawImage(img,dx,dy,dw,dh);
                if(strength<=0)return;
                const src=ctx.getImageData(0,0,W,H),out=ctx.createImageData(W,H),s=src.data,d=out.data;
                const px=cx*W,py=cy*H,R=Math.max(2,Math.min(W,H)*.5*(radius/100)),k=Math.min(2.34,(strength/100)*.78);
                for(let y=0;y<H;y++)for(let x=0;x<W;x++){
                    const vx=x-px,vy=y-py,r=Math.hypot(vx,vy),di=(y*W+x)*4;let sx=x,sy=y;
                    if(r<R&&r>0){const t=r/R,m=t*(1-k*(1-t)*(1-t)),rr=(m*R)/r;sx=Math.round(px+vx*rr);sy=Math.round(py+vy*rr);}
                    sx=Math.max(0,Math.min(W-1,sx));sy=Math.max(0,Math.min(H-1,sy));
                    const si=(sy*W+sx)*4;d[di]=s[si];d[di+1]=s[si+1];d[di+2]=s[si+2];d[di+3]=s[si+3];
                }
                ctx.putImageData(out,0,0);
            }
            function move(e){
                const r=fisheyeRoot.getBoundingClientRect(),p=e.touches?e.touches[0]:e;
                if(!p)return;cx=Math.max(0,Math.min(1,(p.clientX-r.left)/r.width));cy=Math.max(0,Math.min(1,(p.clientY-r.top)/r.height));drawFish();
            }
            if(behavior==="follow"){
                fisheyeRoot.addEventListener("pointermove",move);
                fisheyeRoot.addEventListener("touchmove",e=>{e.preventDefault();move(e);},{passive:false});
            }
            img.onload=drawFish;if(img.complete)drawFish();window.addEventListener("resize",drawFish);
        }

</script>
