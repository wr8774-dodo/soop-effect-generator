<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>SOOP 자동 배포 테스트</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background:
    linear-gradient(
      135deg,
      #6d5dfc,
      #b86cff
    );

  display: flex;
  justify-content: center;
  align-items: center;

  font-family:
    Arial,
    "Apple SD Gothic Neo",
    sans-serif;

  color: white;
}

.card {
  text-align: center;
  padding: 40px;
}

h1 {
  margin: 0 0 15px;
  font-size: clamp(28px, 6vw, 64px);
}

p {
  margin: 0;
  opacity: .85;
  font-size: clamp(14px, 2.5vw, 22px);
}
</style>
</head>

<body>

<div class="card">

  <h1>
    자동 배포 성공 💗
  </h1>

  <p>
    Cloudflare Worker → GitHub → GitHub Pages
  </p>

</div>

</body>
</html>
