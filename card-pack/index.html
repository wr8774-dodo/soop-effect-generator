function later(fn,ms){let epoch=revealEpoch;let id=setTimeout(()=>{if(epoch===revealEpoch)fn()},ms);revealTimers.push(id);return id}
function animateCard(el,frames,options){let a=el.animate(frames,options);revealAnimations.push(a);return a}
function centerPosition(){let k=Math.min((W-48)/300,(H-170)/420,1.25);return {x:(W-300*k)/2,y:(H-420*k)/2+6,k}}
function slotPositions(){let top=Math.max(92,H*.13),bottom=Math.max(84,H*.12),gap=W<600?10:18,k=Math.min((W-32-gap*4)/5/300,(H-top-bottom-gap)/2/420,1),cw=300*k,ch=420*k,startX=(W-5*cw-4*gap)/2,startY=top+(H-top-bottom-2*ch-gap)/2;return sequence.map((_,i)=>({x:startX+(i%5)*(cw+gap),y:startY+Math.floor(i/5)*(ch+gap),k}))}
const transformAt=o=>`translate(${o.x}px,${o.y}px) scale(${o.k})`;
function clearRevealFX(){revealEpoch++;revealTimers.forEach(clearTimeout);revealTimers=[];light.replaceChildren();light.className='reveal-light';dim.className='local-dim';caption.className='';caption.replaceChildren();document.querySelectorAll('.reveal-spark').forEach(e=>e.remove());hint.style.opacity='';document.querySelector('#whiteFlash').className='';}
function resetReveal(){clearRevealFX();revealAnimations.forEach(a=>a.cancel());revealAnimations=[];currentCard=null;complete=false;counter.textContent='';document.body.classList.remove('revealing');inspector.hidden=true;inspector.replaceChildren();}
function stashCurrent(){if(!currentCard)return;let el=currentCard;currentCard=null;clearRevealFX();el.classList.remove('current','silhouette','rim','rr');el.querySelectorAll('.lg-sweep').forEach(e=>e.remove());let from=el.style.transform,to=transformAt(slotPositions()[+el.dataset.index]);el.classList.add('placed');el.style.transform=to;animateCard(el,[{transform:from},{transform:to}],{duration:380,easing:'cubic-bezier(.22,.8,.3,1)'});}
function makeCard(index,level){let tier=tiers[level],el=document.createElement('div');el.className='ncard current';el.dataset.index=index;let face=document.createElement('button');face.className='card tier'+level;face.style.setProperty('--tone',tier.color);face.setAttribute('aria-label',`${index+1}번 ${tier.name} 카드`);face.innerHTML=`<span class="num">NEI · ${String(index+1).padStart(2,'0')}</span><span class="badge">${tier.name}</span>`;applyTierPhoto(face,level);el.append(face);face.onclick=e=>{e.stopPropagation();if(!complete){advance();return}inspector.replaceChildren();let clone=face.cloneNode(true);clone.classList.add('inspected');inspector.append(clone);if(tierPhotos[level]){let save=document.createElement('button');save.className='saveOriginal';save.textContent='원본 사진 저장';save.onclick=e=>{e.stopPropagation();downloadOriginal(level)};inspector.append(save)}inspector.hidden=false;};return el}
inspector.onclick=()=>{inspector.hidden=true;inspector.replaceChildren()};addEventListener('keydown',e=>{if(e.key==='Escape')inspector.hidden=true});
function playWhoosh(){texture(.17,.18,950,5100);texture(.035,.1,500,3500,.13,'foil')}
function reveal(){if(!opened||revealed>=10)return;stashCurrent();let index=revealed++,level=sequence[index],pos=centerPosition(),el=makeCard(index,level);cards.style.display='block';document.body.classList.add('revealing');el.style.transform=transformAt(pos);cards.append(el);currentCard=el;counter.textContent=`${revealed} / 10`;hint.textContent=revealed<10?'화면을 누르면 다음 카드가 나옵니다':'화면을 누르면 획득한 카드를 모아 봅니다';sub.textContent='';playWhoosh();if(level===5){dim.className='local-dim on';el.classList.add('silhouette');anticipationSound();let shake=animateCard(el,[{transform:transformAt(pos)},{transform:transformAt({...pos,x:pos.x-4})},{transform:transformAt({...pos,x:pos.x+4})},{transform:transformAt(pos)}],{duration:110,iterations:7});shake.onfinish=()=>{if(currentCard!==el)return;el.classList.remove('silhouette');startRarity(el,level,pos);let flash=document.querySelector('#whiteFlash');flash.className='go';animateCard(el,[{transform:transformAt(pos),filter:'brightness(1)'},{transform:transformAt({x:pos.x-300*pos.k*.03,y:pos.y-420*pos.k*.03,k:pos.k*1.06}),filter:'brightness(1.3)',offset:.4},{transform:transformAt(pos),filter:'brightness(1)'}],{duration:600,easing:'ease-out'})}}else{animateCard(el,[{transform:transformAt({x:(W-300*pos.k*.6)/2,y:H+40,k:pos.k*.6})+' rotate(-8deg)',opacity:.4},{transform:transformAt({...pos,y:pos.y-18,k:pos.k*1.04})+' rotate(2deg)',opacity:1,offset:.7},{transform:transformAt(pos),opacity:1}],{duration:420,easing:'cubic-bezier(.2,.8,.3,1)'});if(level>=2)startRarity(el,level,pos)} }
function startRarity(el,level,pos){let rare=level!==5,cw=300*pos.k,ch=420*pos.k;light.className='reveal-light legend'+(rare?' rare2':'');light.style.cssText=`left:${W/2}px;top:${pos.y+ch/2}px;--cw:${cw}px;--ch:${ch}px`;dim.className=rare?'local-dim on half':'local-dim on';light.innerHTML='<div class="lg-bloom"></div><div class="lg-god a"></div>'+(!rare?'<div class="lg-god b"></div>':'')+'<div class="lg-wave"></div><div class="lg-flare"></div>'+(!rare?'<div class="lg-flare v"></div>':'')+'<div class="lg-dust"></div>';let dust=light.querySelector('.lg-dust');for(let i=0;i<(rare?16:34);i++){let a=document.createElement('b'),star=i%4===0,size=(star?10:3)+Math.random()*(star?8:4);a.className='lg-p'+(star?' s':'');a.style.cssText=`left:${(Math.random()-.5)*cw*1.9}px;top:${(Math.random()-.2)*ch*1.4*.6}px;width:${size}px;height:${size}px;animation-delay:${Math.random()*2.4}s;animation-duration:${2.6+Math.random()*2.2}s;--dx:${(Math.random()-.5)*60}px`;dust.append(a)}el.classList.add('rim');if(rare)el.classList.add('rr');let sweep=document.createElement('i');sweep.className='lg-sweep';el.append(sweep);caption.className='on'+(rare?' rr':'');let title=level===5?'LEGEND':tiers[level].en,desc=level===5?'전설 카드 획득':level===2?'희귀 카드 획득':tiers[level].name+' 카드 획득';caption.innerHTML=`<span class="lg-title">${title}</span><span class="lg-sub">${desc}</span>`;caption.style.top=Math.min(H-90,pos.y+ch+14)+'px';hint.style.opacity='0';later(()=>{caption.classList.remove('on');hint.style.opacity=''},rare?1800:2200);revealSound(level);for(let i=0;i<(rare?24:46);i++){let a=document.createElement('i'),star=i%3===0,size=star?14+Math.random()*12:4+Math.random()*5,angle=Math.random()*Math.PI*2,r=(140+Math.random()*260)*Math.max(.7,pos.k*(rare?.75:1));a.className='reveal-spark lg-spark'+(rare?' rr':'')+(star?' s':'');a.style.cssText=`left:${W/2}px;top:${pos.y+ch/2}px;width:${size}px;height:${size}px`;document.body.append(a);a.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:0},{transform:`translate(calc(-50% + ${Math.cos(angle)*r*.35}px),calc(-50% + ${Math.sin(angle)*r*.35}px)) scale(1)`,opacity:1,offset:.18},{transform:`translate(calc(-50% + ${Math.cos(angle)*r}px),calc(-50% + ${Math.sin(angle)*r+40}px)) scale(.3)`,opacity:0}],{duration:1100+Math.random()*700,easing:'ease-out'}).onfinish=()=>a.remove()}}
function advance(){if(!opened)return;if(revealed<10){reveal();return}if(!complete){stashCurrent();complete=true;counter.textContent='';hint.textContent='획득한 카드 10장';sub.textContent='카드를 누르면 크게 볼 수 있습니다.'}}
cards.onclick=()=>advance();
function relayoutCards(){let slots=slotPositions();document.querySelectorAll('.ncard').forEach(el=>el.style.transform=transformAt(el.classList.contains('placed')?slots[+el.dataset.index]:centerPosition()));if(currentCard){let pos=centerPosition();light.style.left=W/2+'px';light.style.top=pos.y+210*pos.k+'px';light.style.setProperty('--cw',300*pos.k+'px');light.style.setProperty('--ch',420*pos.k+'px');caption.style.top=Math.min(H-90,pos.y+420*pos.k+14)+'px'}}
addEventListener('resize',relayoutCards);
document.querySelector('#reset').onclick=()=>{lastSound=0;resetReveal();clearTimeout(autoTimer);document.querySelector('#stage').style.display='none';document.querySelector('#stage').innerHTML='';stageActive=false;busy=false;p=0;opened=false;revealed=0;particles=[];cards.replaceChildren(dim,light);cards.style.display='none';clearTimeout(fxTimer);document.querySelector('#revealFx').classList.remove('show');hint.textContent='팩 왼쪽 위를 잡고, 오른쪽으로 천천히 뜯어보세요';sub.textContent='움직인 만큼 뜯깁니다 · 중간에 놓아도 이어서 뜯을 수 있어요'};document.querySelector('#sound').onclick=e=>{sound=!sound;if(sound)audioReady();audioMute();e.target.textContent=sound?'소리 켜짐':'소리 꺼짐'};document.querySelector('#upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image;im.onload=()=>{art=im};im.src=URL.createObjectURL(f)};
</script><script src="photos.js"></script><script src="position.js"></script></html>
